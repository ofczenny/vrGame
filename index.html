<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AoT ODM Demo</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

<div style="
position:fixed;
top:10px;
left:10px;
padding:8px 12px;
background:rgba(0,0,0,0.6);
color:white;
font-family:monospace;
border-radius:6px;
z-index:999;">
Q = Left Hook<br>
E = Right Hook<br>
SPACE = Gas Boost<br>
SHIFT + SPACE = Turbo Boost<br>
WASD = Move
</div>

<a-scene>

  <a-assets>
    <img id="floor" src="assets/images/floor.jpg">
    <a-asset-item id="robot" src="assets/models/robot.glb"></a-asset-item>
  </a-assets>

  <!-- PLAYER -->

  <a-entity
    id="rig"
    position="0 1.6 5"
    odm-gear>

    <a-entity
      camera
      look-controls
      wasd-controls>

      <!-- CROSSHAIR -->

      <a-entity
        position="0 0 -1"
        geometry="primitive:ring;
                  radiusInner:0.002;
                  radiusOuter:0.004"
        material="color:white;shader:flat">
      </a-entity>

      <!-- LEFT BLADE -->

      <a-box
        position="-0.25 -0.3 -0.5"
        width="0.03"
        height="0.5"
        depth="0.03"
        color="silver">
      </a-box>

      <!-- RIGHT BLADE -->

      <a-box
        position="0.25 -0.3 -0.5"
        width="0.03"
        height="0.5"
        depth="0.03"
        color="silver">
      </a-box>

    </a-entity>

  </a-entity>

  <!-- TEST ROBOT -->

  <a-entity
    gltf-model="#robot"
    class="grapple-target"
    position="0 0 -10">
  </a-entity>

  <!-- BUILDINGS -->

  <a-box class="grapple-target"
         position="0 10 -20"
         width="8"
         height="20"
         depth="8"
         color="#888">
  </a-box>

  <a-box class="grapple-target"
         position="15 12 -30"
         width="10"
         height="24"
         depth="10"
         color="#777">
  </a-box>

  <a-box class="grapple-target"
         position="-15 8 -25"
         width="8"
         height="16"
         depth="8"
         color="#666">
  </a-box>

  <a-box class="grapple-target"
         position="25 15 -10"
         width="12"
         height="30"
         depth="12"
         color="#555">
  </a-box>

  <a-box class="grapple-target"
         position="-25 13 -15"
         width="10"
         height="26"
         depth="10"
         color="#777">
  </a-box>

  <!-- ARENA WALLS -->

  <a-box class="grapple-target"
         position="0 5 -50"
         width="100"
         height="10"
         depth="1"
         color="#DDD">
  </a-box>

  <a-box class="grapple-target"
         position="-50 5 0"
         width="1"
         height="10"
         depth="100"
         color="#DDD">
  </a-box>

  <a-box class="grapple-target"
         position="50 5 0"
         width="1"
         height="10"
         depth="100"
         color="#DDD">
  </a-box>

  <!-- GROUND -->

  <a-plane
    class="grapple-target"
    position="0 0 0"
    rotation="-90 0 0"
    width="100"
    height="100"
    color="#7BC8A4">
  </a-plane>

  <a-sky color="#87CEEB"></a-sky>

</a-scene>

<script>

AFRAME.registerComponent('odm-gear', {

  schema: {
    hookRange: {default: 35},
    pullAccel: {default: 30},
    gasBoost: {default: 20},
    boostMultiplier: {default: 2},
    gravity: {default: -9.8},
    maxFallSpeed: {default: -25},
    drag: {default: 0.995},
    groundY: {default: 1.6}
  },

  init: function () {

    this.velocity = new THREE.Vector3();

    this.hooks = {
      q: null,
      e: null
    };

    this.spaceHeld = false;
    this.shiftHeld = false;

    this.raycaster = new THREE.Raycaster();
    this.targets = [];

    this.el.sceneEl.addEventListener('loaded', () => {

      this.targets =
      [...document.querySelectorAll('.grapple-target')]
      .map(el => el.object3D);

    });

    this.onKeyDown = this.onKeyDown.bind(this);
    this.onKeyUp = this.onKeyUp.bind(this);

    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('keyup', this.onKeyUp);
  },

  onKeyDown(evt) {

    const key = evt.key.toLowerCase();

    if(evt.code === 'Space')
      this.spaceHeld = true;

    if(evt.key === 'Shift')
      this.shiftHeld = true;

    if(evt.repeat) return;

    if(key === 'q' && !this.hooks.q)
      this.fireHook('q', -1);

    if(key === 'e' && !this.hooks.e)
      this.fireHook('e', 1);

  },

  onKeyUp(evt) {

    const key = evt.key.toLowerCase();

    if(evt.code === 'Space')
      this.spaceHeld = false;

    if(evt.key === 'Shift')
      this.shiftHeld = false;

    if(key === 'q')
      this.releaseHook('q');

    if(key === 'e')
      this.releaseHook('e');

  },

  fireHook(key, side) {

    const camera =
      this.el.querySelector('[camera]');

    if(!camera) return;

    const camObj = camera.object3D;

    const origin = new THREE.Vector3();
    camObj.getWorldPosition(origin);

    const direction = new THREE.Vector3();
    camObj.getWorldDirection(direction);

    const sideOffset =
      new THREE.Vector3(side*0.45,0.25,0);

    sideOffset.applyQuaternion(
      camObj.getWorldQuaternion(
        new THREE.Quaternion()
      )
    );

    direction.add(sideOffset).normalize();

    this.raycaster.set(origin,direction);
    this.raycaster.far =
      this.data.hookRange;

    const hits =
      this.raycaster.intersectObjects(
        this.targets,
        true
      );

    let anchor;

    if(hits.length > 0)
      anchor = hits[0].point.clone();
    else
      anchor = origin.clone()
        .addScaledVector(
          direction,
          this.data.hookRange
        );

    const line =
      document.createElement('a-entity');

    line.setAttribute('line',{
      start:'0 0 0',
      end:'0 0 0',
      color:'#cccccc'
    });

    this.el.sceneEl.appendChild(line);

    this.hooks[key]={
      anchor,
      line
    };

  },

  releaseHook(key) {

    const hook = this.hooks[key];

    if(!hook) return;

    if(hook.line.parentNode)
      hook.line.parentNode.removeChild(
        hook.line
      );

    this.hooks[key]=null;
  },

  tick(time,delta) {

    if(!delta) return;

    const dt =
      Math.min(delta/1000,0.1);

    const pos =
      this.el.object3D.position;

    let grappling = false;

    ['q','e'].forEach(key=>{

      const hook =
        this.hooks[key];

      if(!hook) return;

      grappling = true;

      const toAnchor =
        hook.anchor.clone().sub(pos);

      const distance =
        toAnchor.length();

      if(distance < 0.75){

        this.releaseHook(key);
        return;

      }

      toAnchor.normalize();

      const tangent =
        this.velocity.clone()
        .sub(
          toAnchor.clone().multiplyScalar(
            this.velocity.dot(toAnchor)
          )
        );

      this.velocity.copy(tangent);

      this.velocity.addScaledVector(
        toAnchor,
        this.data.pullAccel * dt
      );

      hook.line.setAttribute('line',{

        start:
          pos.x+' '+pos.y+' '+pos.z,

        end:
          hook.anchor.x+' '+
          hook.anchor.y+' '+
          hook.anchor.z

      });

    });

    const camera =
      this.el.querySelector('[camera]');

    if(camera && this.spaceHeld){

      const forward =
        new THREE.Vector3();

      camera.object3D.getWorldDirection(
        forward
      );

      let boost =
        this.data.gasBoost;

      if(this.shiftHeld)
        boost *=
          this.data.boostMultiplier;

      this.velocity.addScaledVector(
        forward,
        boost*dt
      );

    }

    if(!grappling){

      this.velocity.y +=
        this.data.gravity*dt;

      if(
        this.velocity.y <
        this.data.maxFallSpeed
      ){
        this.velocity.y =
          this.data.maxFallSpeed;
      }

    }

    if(grappling && pos.y > 2)
      this.velocity.y *= 0.97;

    this.velocity.multiplyScalar(
      this.data.drag
    );

    pos.addScaledVector(
      this.velocity,
      dt
    );

    if(pos.y < this.data.groundY){

      pos.y =
        this.data.groundY;

      this.velocity.y = 0;

    }

  }

});

</script>

</body>
</html>
