<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ODM Gear Launch Demo</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

<a-scene>

  <!-- Player -->
  <a-sphere id="player" position="0 1.5 -4" radius="0.3" color="red"></a-sphere>

  <!-- Grapple Targets -->
  <a-sphere id="leftHook"  position="-3 3 -4" radius="0.2" color="blue"></a-sphere>
  <a-sphere id="rightHook" position="3 3 -4"  radius="0.2" color="blue"></a-sphere>

  <!-- Grapple Line -->
  <a-entity id="grappleLine"
            line="start: 0 0 0; end: 0 0 0; color: #00ffff"
            visible="false">
  </a-entity>

  <!-- Ground -->
  <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="green"></a-plane>

  <a-sky color="lightblue"></a-sky>

</a-scene>

<script>
  const player = document.querySelector('#player');
  const leftHook = document.querySelector('#leftHook');
  const rightHook = document.querySelector('#rightHook');
  const line = document.querySelector('#grappleLine');

  let activeHook = null;
  let launching = false;

  // Player velocity
  let velocity = {x: 0, y: 0, z: 0};

  function vec3(entity) {
    const p = entity.getAttribute('position');
    return {x: p.x, y: p.y, z: p.z};
  }

  function launchTowardHook() {
    if (!launching || !activeHook) return;

    const p = vec3(player);
    const h = vec3(activeHook);

    // Draw line
    line.setAttribute('visible', true);
    line.setAttribute('line', `start: ${p.x} ${p.y} ${p.z}; end: ${h.x} ${h.y} ${h.z}`);

    // Direction vector
    const dx = h.x - p.x;
    const dy = h.y - p.y;
    const dz = h.z - p.z;

    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

    // Normalize direction
    const nx = dx / dist;
    const ny = dy / dist;
    const nz = dz / dist;

    // *** LAUNCH FORCE ***
    const launchForce = 0.25;   // increase for faster ODM launch

    // Set velocity toward hook
    velocity.x = nx * launchForce;
    velocity.y = ny * launchForce;
    velocity.z = nz * launchForce;
  }

  // Key controls
  window.addEventListener('keydown', (e) => {
    if (e.key === 'q' || e.key === 'Q') {
      activeHook = leftHook;
      launching = true;
      launchTowardHook(); // fire instantly
    }
    if (e.key === 'e' || e.key === 'E') {
      activeHook = rightHook;
      launching = true;
      launchTowardHook(); // fire instantly
    }
  });

  window.addEventListener('keyup', () => {
    launching = false;
    activeHook = null;
    line.setAttribute('visible', false);
  });

  // Game loop
  function tick() {
    const p = vec3(player);

    // Apply velocity to player
    player.setAttribute('position', {
      x: p.x + velocity.x,
      y: p.y + velocity.y,
      z: p.z + velocity.z
    });

    // Slow down gradually (momentum)
    velocity.x *= 0.97;
    velocity.y *= 0.97;
    velocity.z *= 0.97;

    requestAnimationFrame(tick);
  }

  tick();
</script>

</body>
</html>
