<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ODM Gear (Canvas Version)</title>
  <style>
    body { margin: 0; background: #111; }
    canvas { display: block; background: #222; }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Player
let player = {
  x: 0,
  y: 0,
  vx: 0,
  vy: 0,
  size: 20
};

// Grapple points
const leftHook  = { x: -200, y: -200 };
const rightHook = { x:  200, y: -200 };

let activeHook = null;
let grappling = false;

// Camera offset
let camX = 0;
let camY = 0;

// Launch force
const launchForce = 0.4;

// Input
window.addEventListener("keydown", e => {
  if (e.key === "q" || e.key === "Q") {
    activeHook = leftHook;
    grappling = true;
    launch();
  }
  if (e.key === "e" || e.key === "E") {
    activeHook = rightHook;
    grappling = true;
    launch();
  }
});

window.addEventListener("keyup", () => {
  grappling = false;
  activeHook = null;
});

// Launch player toward hook
function launch() {
  if (!activeHook) return;

  const dx = activeHook.x - player.x;
  const dy = activeHook.y - player.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  const nx = dx / dist;
  const ny = dy / dist;

  player.vx = nx * launchForce;
  player.vy = ny * launchForce;
}

// Game loop
function update() {
  // Apply velocity
  player.x += player.vx;
  player.y += player.vy;

  // Momentum decay
  player.vx *= 0.97;
  player.vy *= 0.97;

  // Camera follows player
  camX = player.x - canvas.width / 2;
  camY = player.y - canvas.height / 2;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-camX, -camY);

  // Draw grapple points
  ctx.fillStyle = "blue";
  ctx.beginPath();
  ctx.arc(leftHook.x, leftHook.y, 10, 0, Math.PI * 2);
  ctx.arc(rightHook.x, rightHook.y, 10, 0, Math.PI * 2);
  ctx.fill();

  // Draw rope
  if (grappling && activeHook) {
    ctx.strokeStyle = "#0ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(activeHook.x, activeHook.y);
    ctx.stroke();
  }

  // Draw player
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
