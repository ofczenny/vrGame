<!DOCTYPE html>
<html>
<head>
    <title>VR Escape Room</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

<a-scene>

    <!-- Lighting -->
    <a-light type="ambient" color="#BBB"></a-light>
    <a-light type="point" color="#FFFFFF" intensity="1"
             position="0 4 0"></a-light>

    <!-- Floor -->
    <a-plane
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#808080">
    </a-plane>

    <!-- Walls -->
    <a-box position="0 2 -10" width="20" height="5" depth="0.5" color="#444"></a-box>
    <a-box position="-10 2 0" width="0.5" height="5" depth="20" color="#555"></a-box>
    <a-box position="10 2 0" width="0.5" height="5" depth="20" color="#555"></a-box>

    <!-- Exit Door -->
    <a-box id="exitDoor"
           position="0 1 -9.5"
           width="2"
           height="3"
           depth="0.3"
           color="red">
    </a-box>

    <!-- Puzzle Object 1 -->
    <a-box id="redBook"
           position="-3 1 -4"
           color="red">
    </a-box>

    <!-- Puzzle Object 2 -->
    <a-box id="blueBook"
           position="0 1 -4"
           color="blue">
    </a-box>

    <!-- Puzzle Object 3 -->
    <a-box id="greenBook"
           position="3 1 -4"
           color="green">
    </a-box>

    <!-- Final Button -->
    <a-cylinder id="unlockButton"
                position="0 1 -7"
                radius="0.4"
                height="0.2"
                color="yellow">
    </a-cylinder>

    <!-- Camera -->
    <a-camera position="0 1.6 5">
        <a-cursor></a-cursor>
    </a-camera>

</a-scene>

<script>

let bookCounter = 0;
let booksSolved = false;
let doorUnlocked = false;

/* Puzzle 1:
Player must click all 3 books.
*/

function checkBooks() {

    if (bookCounter >= 3) {

        booksSolved = true;

        alert("Puzzle solved! Press the yellow button.");
    }
}

document
.getElementById("redBook")
.addEventListener("click", function() {

    this.setAttribute("color", "white");
    bookCounter++;

    checkBooks();
});

document
.getElementById("blueBook")
.addEventListener("click", function() {

    this.setAttribute("color", "white");
    bookCounter++;

    checkBooks();
});

document
.getElementById("greenBook")
.addEventListener("click", function() {

    this.setAttribute("color", "white");
    bookCounter++;

    checkBooks();
});

/* Puzzle 2:
Unlock button only works after books puzzle.
*/
document
.getElementById("unlockButton")
.addEventListener("click", function() {

    if (booksSolved) {

        doorUnlocked = true;

        alert("Door unlocked!");

        document
        .getElementById("exitDoor")
        .setAttribute("color", "green");

    } else {

        alert("Solve the book puzzle first!");
    }
});


/* Exit Door */
document
.getElementById("exitDoor")
.addEventListener("click", function() {

    if (doorUnlocked) {

        this.setAttribute("position", "0 6 -9.5");

        alert("Congratulations! You escaped!");

    } else {

        alert("The door is locked.");
    }
});

</script>

</body>
</html>
